name: Verificar vitrine
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: node --check app.js
      - name: Verificar arquivos essenciais
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          grep -q 'id="search"' index.html
          grep -q 'id="catalog"' index.html
          grep -q 'id="cartCount"' index.html
